name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/tsx-analyst-ranking-app-90q33w]
    paths:
      - "src/**"
      - "config/**"
      - "data/**"
      - "package*.json"
      - "next.config.mjs"
      - ".github/workflows/deploy-pages.yml"
  # Rebuild with fresh data as soon as the daily refresh commits a new snapshot.
  workflow_run:
    workflows: ["Daily analyst refresh"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight; let a newer push win rather than queuing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
